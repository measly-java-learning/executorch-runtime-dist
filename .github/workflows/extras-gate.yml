name: extras-gate
on:
  pull_request:
    paths:
      - 'extras/**'
      - 'build-runtime.sh'
      - 'scripts/classify-gate.sh'
      - '.github/workflows/extras-gate.yml'
      - '.build-image'
      # ccache surface: these run ONLY in full-build/full-aot, so a version bump that
      # touched nothing else would otherwise start no workflow at all.
      - 'scripts/lib/ccache.sh'
      - 'scripts/install-ccache.sh'
      - 'scripts/ccache-stats.sh'
      # OpenVINO surface. classify-gate.sh routes these to `full`, but that rule is dead unless
      # the workflow actually STARTS for them — a PR touching only vendor-openvino.sh would
      # otherwise get no gate at all. cmakeflags.sh is here because it now decides whether the
      # OpenVINO delegate is compiled in (EXECUTORCH_BUILD_OPENVINO).
      - 'scripts/vendor-openvino.sh'
      - 'scripts/lib/openvino.sh'
      - 'scripts/lib/cmakeflags.sh'
      # The OpenVINO gate scripts themselves. They run ONLY in `full`, so an edit to one would
      # otherwise ship with no run at all — the gates would be the least-tested code here.
      - 'test/openvino_smoke.sh'
      - 'test/openvino_fixture_run.sh'
      - 'test/openvino/**'
      # Workspace-size surface, same reasoning: these run only in `full`, so without a trigger an
      # edit to one would ship with no run at all.
      - 'scripts/patch-et-xnnpack-workspace.sh'
      - 'scripts/emit-xnnpack-fixtures.py'
      - 'patches/**'
      - 'test/xnnpack_workspace_run.sh'
      - 'test/xnnpack_workspace/**'

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.c.outputs.mode }}
      etver: ${{ steps.c.outputs.etver }}
      release_tag: ${{ steps.c.outputs.release_tag }}
      image: ${{ steps.img.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # need the merge base to diff against base_ref
      - name: Changed files vs base
        run: git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}   # classify-gate.sh's gh release lookup
        run: ./scripts/classify-gate.sh changed.txt | tee -a "$GITHUB_OUTPUT"
      - id: img
        # The build container is pinned by digest in .build-image. container.image is resolved
        # before any step runs, so it cannot read $GITHUB_ENV - it has to come through a job
        # output. Bare `cat` plus a non-empty check: the file is one line and holds no comments.
        run: |
          set -euo pipefail
          image="$(cat .build-image)"
          test -n "$image" || { echo "empty .build-image" >&2; exit 1; }
          echo "image=$image" | tee -a "$GITHUB_OUTPUT"

  # Download + verify (sha256 + attestation) the logging tarballs (both arches) and the
  # fixtures in an ubuntu job, because `gh` is not present in the manylinux containers.
  fetch:
    needs: classify
    if: needs.classify.outputs.mode == 'tier1' || needs.classify.outputs.mode == 'tier2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read        # gh attestation verify (same-repo PRs; fork tokens can't elevate)
    env:
      ETVER: ${{ needs.classify.outputs.etver }}
      RELEASE_TAG: ${{ needs.classify.outputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      # Fork PRs run with a reduced, secret-less read token GitHub does not let the workflow
      # elevate, so `gh attestation verify` can fail on forks. sha256 is the MANDATORY
      # integrity gate in every case (the .sha256 is published by our release, so a match
      # proves the bytes are exactly what we shipped); attestation is defense-in-depth —
      # enforced for same-repo PRs, best-effort (skipped with a notice) on forks, so
      # external contributions are never blocked.
      IS_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Download + verify runtime tarballs + fixtures
        run: |
          set -euo pipefail
          mkdir gate-inputs
          # Build the -p pattern list as a bash ARRAY (never via `printf %q` + word-split:
          # %q emits shell quoting that command-substitution does NOT re-parse, so a quoted
          # token would reach gh as a literal-quote glob and silently match nothing).
          fx="etnp-lstm-fixtures-${ETVER}.tar.gz"
          patterns=( -p "$fx" -p "$fx.sha256" )
          for plat in linux-x86_64 linux-aarch64; do
            tb="executorch-runtime-${ETVER}-logging-${plat}.tar.gz"
            patterns+=( -p "$tb" -p "$tb.sha256" )
          done
          ( cd gate-inputs && gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${patterns[@]}" )
          cd gate-inputs
          for f in *.tar.gz; do
            sha256sum -c "$f.sha256"                 # mandatory integrity gate (all PRs, incl. forks)
          done
          if [ "$IS_SAME_REPO" = "true" ]; then
            for f in *.tar.gz; do
              gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"   # provenance (defense-in-depth)
            done
          else
            echo "::notice::fork PR — skipping gh attestation verify (fork token lacks access); sha256 integrity is still enforced. See docs/extras-gate.md."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: gate-inputs
          path: gate-inputs/*

  # Tier 1: torch-free consumer smoke on BOTH arches. Rebuilds extras from the branch
  # against the downloaded prefix, then runs the published .pte vs golden.
  fast-gate:
    needs: [classify, fetch]
    if: needs.classify.outputs.mode == 'tier1' || needs.classify.outputs.mode == 'tier2'
    runs-on: ${{ matrix.combo.runs_on }}
    container:
      image: ${{ needs.classify.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        combo:
          # No container here: .build-image is a multi-arch manifest list, so ONE reference
          # resolves per-arch and both rows share the pin from classify's output.
          - { platform: linux-x86_64,  runs_on: ubuntu-latest }
          - { platform: linux-aarch64, runs_on: ubuntu-24.04-arm }
    env:
      ETVER: ${{ needs.classify.outputs.etver }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gate-inputs
          path: gate-inputs
      - name: Extract prefix + fixtures
        run: |
          set -euo pipefail
          mkdir prefix fixtures
          tar -C prefix   -xzf "gate-inputs/executorch-runtime-${ETVER}-logging-${{ matrix.combo.platform }}.tar.gz" --strip-components=1
          tar -C fixtures -xzf "gate-inputs/etnp-lstm-fixtures-${ETVER}.tar.gz"
      - name: Scrub shipped extras (so a rename/removal cannot false-pass)
        run: |
          rm -f  prefix/lib/libetnp_ops_*.a prefix/lib/libhwy.a
          rm -rf prefix/lib/cmake/ETNPExtras prefix/include/etnp
      - name: Rebuild extras from branch (phase 2 only) + consumer smoke
        run: |
          set -euo pipefail
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          pip install -r requirements/extras-build.txt    # cmake is present in the manylinux image (as in release.yml)
          ./build-runtime.sh --extras-only --variant logging --prefix "$PWD/prefix"
          FIXTURES_DIR="$PWD/fixtures" ETNP_PREFIX="$PWD/prefix" \
            python extras/lstm/test/consumer_smoke.py

  # Tier 2: the live torch round-trip (AOT<->runtime drift), reusing the downloaded
  # prefix so it STILL skips the ~15min ET compile — only torch/export is added.
  live-roundtrip:
    needs: [classify, fetch]
    if: needs.classify.outputs.mode == 'tier2'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.classify.outputs.image }}
    env:
      ETVER: ${{ needs.classify.outputs.etver }}
    steps:
      - uses: actions/checkout@v7
      - name: Checkout ExecuTorch source (for the export python package)
        uses: ./.github/actions/checkout-executorch
        with:
          ref: v${{ needs.classify.outputs.etver }}
      - uses: actions/download-artifact@v8
        with:
          name: gate-inputs
          path: gate-inputs
      - name: Extract prefix + rebuild extras from branch
        run: |
          set -euo pipefail
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          mkdir prefix
          tar -C prefix -xzf "gate-inputs/executorch-runtime-${ETVER}-logging-linux-x86_64.tar.gz" --strip-components=1
          rm -f  prefix/lib/libetnp_ops_*.a prefix/lib/libhwy.a
          rm -rf prefix/lib/cmake/ETNPExtras prefix/include/etnp
          pip install -r requirements/extras-build.txt
          ./build-runtime.sh --extras-only --variant logging --prefix "$PWD/prefix"
      - name: Live round-trip (export -> run vs eager)
        uses: ./.github/actions/lstm-roundtrip
        with:
          # workspace-relative: the action re-roots onto $PWD (real container workspace),
          # NOT the github.workspace expression (host path — invisible inside the container).
          prefix: prefix

  # Fallback: any build-runtime.sh change (or no matching release) -> a full release DRY-RUN,
  # so a green gate means the eventual release tag will build before a pkgrev is spent.
  #
  # Split into three jobs because the two heavy halves are INDEPENDENT: the C++ recipe build
  # (~12min) needs no python, and building ExecuTorch's python package (~15min, what
  # install_executorch.sh does) needs no built prefix. Run sequentially they cost ~30min of wall
  # clock; run in parallel with a fixtures hand-off, ~19min. Runner minutes are slightly higher —
  # this trades them for latency on the gate every recipe change has to pass.
  full-build:
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.classify.outputs.image }}
    env:
      ETVER: ${{ needs.classify.outputs.etver }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Floor for the ccache hit rate, enforced only on an exact cache-key match. Deliberately
      # low: it catches "the cache stopped working", not "the cache is suboptimal". It lives in
      # this env block ON PURPOSE - the cache key's hashFiles() set includes scripts/lib/*, so
      # tuning it there would invalidate every cache on every tweak.
      CCACHE_MIN_HIT_RATE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Checkout ExecuTorch source
        uses: ./.github/actions/checkout-executorch
        with:
          ref: v${{ needs.classify.outputs.etver }}
      - name: Install pinned ccache
        run: ./scripts/install-ccache.sh
      - name: Restore ccache
        id: ccache-restore
        # RESTORE + SAVE as separate actions, not the combined `actions/cache`. The combined action
        # exposes only `cache-hit` (an EXACT primary-key match). Our primary key ends in
        # `github.sha`, so an exact match happens only when re-running an identical commit - every
        # normal push restores via a restore-key instead. Enforcing on `cache-hit` would therefore
        # mean the threshold NEVER fires on a real PR: a vacuous guard. `actions/cache/restore`
        # additionally exposes `cache-matched-key`, which is what makes the enforcement condition
        # below expressible.
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          # <sha> suffix is REQUIRED: a cache key is write-once, so without it the cache would be
          # written on the first run and then frozen forever. restore-keys supply the nearest prior
          # cache. This is hit-rate tuning only - ccache re-hashes every object, so a stale restore
          # cannot produce a wrong artifact, only a slower build.
          #
          # full-build hashes the recipe inputs it actually compiles from (build-runtime.sh,
          # patches/*, scripts/lib/*) - unlike full-aot, which never runs them. This is the
          # enforcement-correct choice: a recipe change must produce a DIFFERENT inputs hash, so
          # the restore falls back to the loose `-et<ver>-` prefix (enforcement off, reporting
          # only) instead of matching "identical inputs" and then failing the 1% floor on a run
          # that legitimately misses everything.
          key: ccache-full-build-x86_64-et${{ needs.classify.outputs.etver }}-${{ hashFiles('.build-image', 'build-runtime.sh', 'patches/*', 'scripts/lib/*.sh') }}-${{ github.sha }}
          restore-keys: |
            ccache-full-build-x86_64-et${{ needs.classify.outputs.etver }}-${{ hashFiles('.build-image', 'build-runtime.sh', 'patches/*', 'scripts/lib/*.sh') }}-
            ccache-full-build-x86_64-et${{ needs.classify.outputs.etver }}-
      - name: Configure ccache
        # -z zeroes the counters so the stats step measures THIS run, not the restored cache's
        # lifetime. Without it the reported rate drifts upward forever and the floor is meaningless.
        run: |
          set -euo pipefail
          ccache -M 2G
          ccache -z
          ccache --version | head -1
      - name: Full build (release dry-run - full ET compile)
        # ExecuTorch's own CMakeLists auto-detects ccache (find_program at CMakeLists.txt:187),
        # so with ccache on PATH the whole ET compile goes through the launcher. The extras
        # sub-build (phase 2) is a separate, seconds-long cmake project - not worth wiring.
        run: |
          set -euo pipefail
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          ./build-runtime.sh --variant logging --prefix "$PWD/out" \
            --et-src "$PWD/et-src/executorch" --et-tag "v${ETVER}"
      - name: Save ccache
        # Explicit save, because the restore/save split has no automatic post-step. `always()` so a
        # failed build still banks the objects it did compile - they are valid regardless of why
        # the job failed, and re-compiling them next run is pure waste.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: ccache stats
        # Enforce only when the restored cache came from the SAME build inputs. `cache-matched-key`
        # reports which key actually matched; if it carries our inputs hash, the restored objects
        # are the ones this build should be reusing and a low hit rate means ccache is broken. If
        # it matched only the looser `-et<ver>-` prefix (a different image or recipe), the run
        # legitimately misses everything and must NOT be failed for it.
        #
        # Deliberately NOT `cache-hit == 'true'`: that requires an exact match including the sha,
        # which only happens when re-running an identical commit, so enforcement would never fire.
        env:
          CCACHE_PRIMARY_KEY: ${{ steps.ccache-restore.outputs.cache-primary-key }}
          CCACHE_MATCHED_KEY: ${{ steps.ccache-restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          # Strip the trailing -<sha> to get the inputs-identifying prefix.
          prefix="${CCACHE_PRIMARY_KEY%-*}-"
          if [ -n "$CCACHE_MATCHED_KEY" ] && [ "${CCACHE_MATCHED_KEY#"$prefix"}" != "$CCACHE_MATCHED_KEY" ]; then
            echo "restored a cache built from identical inputs - enforcing the floor"
            export CCACHE_ENFORCE=1
          else
            echo "no cache, or one from different inputs (matched: ${CCACHE_MATCHED_KEY:-none}) - reporting only"
            export CCACHE_ENFORCE=0
          fi
          ./scripts/ccache-stats.sh
      - name: Extras members + ETNPExtras relocatability gate
        # Runs immediately after the build so a missing member or a leaked absolute prefix fails
        # here rather than later in full-gates, where the cause is far less obvious. This is the
        # PR-time counterpart of the same check in release.yml; see issue #26 - it needs a built
        # prefix, so it is not part of the hermetic suite.
        run: PREFIX="$PWD/out" bash test/extras_members.sh
      - name: Pack the prefix for full-gates
        # tar, not a raw directory upload: the prefix is ~1200 small files and upload-artifact is
        # far slower per-file than per-byte. Symlinks and modes also survive a tar; the OpenVINO
        # and workspace gates link against this tree, so mode bits matter.
        run: tar -czf prefix.tar.gz -C "$PWD" out
      - uses: actions/upload-artifact@v7
        with:
          name: full-prefix
          path: prefix.tar.gz
          retention-days: 1

  # Builds ExecuTorch's PYTHON package from the same pinned source and mints every fixture the
  # gates consume. Deliberately does NOT need the built prefix, which is what lets it run in
  # parallel with full-build. Everything it produces is a FILE, so it hands off as an artifact.
  full-aot:
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.classify.outputs.image }}
    env:
      ETVER: ${{ needs.classify.outputs.etver }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Floor for the ccache hit rate, enforced only on an exact cache-key match. Deliberately
      # low: it catches "the cache stopped working", not "the cache is suboptimal". It lives in
      # this env block ON PURPOSE - scripts/lib/* is inside the cache key's hashFiles() set, so
      # tuning it there would invalidate every cache on every tweak.
      CCACHE_MIN_HIT_RATE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Checkout ExecuTorch source
        uses: ./.github/actions/checkout-executorch
        with:
          ref: v${{ needs.classify.outputs.etver }}
      - name: Install pinned ccache
        run: ./scripts/install-ccache.sh
      - name: Restore ccache
        id: ccache-restore
        # RESTORE + SAVE as separate actions, not the combined `actions/cache`. The combined action
        # exposes only `cache-hit` (an EXACT primary-key match). Our primary key ends in
        # `github.sha`, so an exact match happens only when re-running an identical commit - every
        # normal push restores via a restore-key instead. Enforcing on `cache-hit` would therefore
        # mean the threshold NEVER fires on a real PR: a vacuous guard. `actions/cache/restore`
        # additionally exposes `cache-matched-key`, which is what makes the enforcement condition
        # below expressible.
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          # <sha> suffix is REQUIRED: a cache key is write-once, so without it the cache would be
          # written on the first run and then frozen forever. restore-keys supply the nearest prior
          # cache. This is hit-rate tuning only - ccache re-hashes every object, so a stale restore
          # cannot produce a wrong artifact, only a slower build.
          key: ccache-full-aot-x86_64-et${{ needs.classify.outputs.etver }}-${{ hashFiles('.build-image', 'scripts/lib/ccache.sh') }}-${{ github.sha }}
          restore-keys: |
            ccache-full-aot-x86_64-et${{ needs.classify.outputs.etver }}-${{ hashFiles('.build-image', 'scripts/lib/ccache.sh') }}-
            ccache-full-aot-x86_64-et${{ needs.classify.outputs.etver }}-
      - name: Configure ccache
        # -z zeroes the counters so the stats step measures THIS run, not the restored cache's
        # lifetime. Without it the reported rate drifts upward forever and the floor is meaningless.
        run: |
          set -euo pipefail
          ccache -M 2G
          ccache -z
          ccache --version | head -1
      - name: Install the AOT toolchain (executorch python package from the pinned source)
        # This is the ~15min half. It compiles ExecuTorch a second time - the python package -
        # which every emitter below imports. Nothing here touches the recipe's install prefix.
        run: |
          set -euo pipefail
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          # ExecuTorch's own CMakeLists auto-detects ccache (find_program at CMakeLists.txt:187),
          # but pytorch_tokenizers is a SEPARATE cmake project with no ccache logic - and it is the
          # ~5 minute sdist build. Its setup.py forwards CMAKE_ARGS, so inject the launcher here.
          export CMAKE_ARGS="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache"
          (cd et-src/executorch && ./install_executorch.sh)
          pip install -r requirements/extras-build.txt
      - name: Save ccache
        # Explicit save, because the restore/save split has no automatic post-step. `always()` so a
        # failed build still banks the objects it did compile - they are valid regardless of why
        # the job failed, and re-compiling them next run is pure waste.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: ccache stats
        # Enforce only when the restored cache came from the SAME build inputs. `cache-matched-key`
        # reports which key actually matched; if it carries our inputs hash, the restored objects
        # are the ones this build should be reusing and a low hit rate means ccache is broken. If
        # it matched only the looser `-et<ver>-` prefix (a different image or ccache version), the
        # run legitimately misses everything and must NOT be failed for it.
        #
        # Deliberately NOT `cache-hit == 'true'`: that requires an exact match including the sha,
        # which only happens when re-running an identical commit, so enforcement would never fire.
        env:
          CCACHE_PRIMARY_KEY: ${{ steps.ccache-restore.outputs.cache-primary-key }}
          CCACHE_MATCHED_KEY: ${{ steps.ccache-restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          # Strip the trailing -<sha> to get the inputs-identifying prefix.
          prefix="${CCACHE_PRIMARY_KEY%-*}-"
          if [ -n "$CCACHE_MATCHED_KEY" ] && [ "${CCACHE_MATCHED_KEY#"$prefix"}" != "$CCACHE_MATCHED_KEY" ]; then
            echo "restored a cache built from identical inputs - enforcing the floor"
            export CCACHE_ENFORCE=1
          else
            echo "no cache, or one from different inputs (matched: ${CCACHE_MATCHED_KEY:-none}) - reporting only"
            export CCACHE_ENFORCE=0
          fi
          ./scripts/ccache-stats.sh
      - name: Emit LSTM fixtures FRESH from the branch AOT
        # These are the export half of the live round-trip: lstm_case.build_case() is the same
        # source test_lstm_roundtrip.py uses, so a golden minted here is an eager-torch golden
        # for the branch's own AOT definition. full-gates runs them against the branch's runtime
        # and compares - the two halves together are the round-trip, split across jobs.
        run: |
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          python extras/lstm/aot/emit_fixtures.py "$PWD/fixtures-dryrun/lstm"
      - name: Emit OpenVINO fixtures (prove the delegated export works; not published)
        # The openvino wheel is a REAL dependency of this emit: the ET partitioner imports
        # openvino.frontend.pytorch at module scope. Before the job split it was satisfied by
        # accident - the bundle-smoke step that pip-installed it happened to run earlier in the
        # same job. That step now lives in full-gates, so install it here explicitly rather than
        # depending on step order in another job. Version comes from the openvino.sh SSOT, the
        # same pin the vendored bundle is built from.
        run: |
          set -euo pipefail
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          pip install -r requirements/openvino-aot.txt
          python scripts/emit-openvino-fixtures.py "$PWD/fixtures-dryrun/openvino"
      - name: Emit XNNPACK-delegated fixtures for the workspace-size gate
        run: |
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          python scripts/emit-xnnpack-fixtures.py "$PWD/fixtures-dryrun/xnnpack"
      - uses: actions/upload-artifact@v7
        with:
          name: full-fixtures
          path: fixtures-dryrun/**
          retention-days: 1

  # Everything that needs BOTH halves. Cheap (~2min): no compiler-bound work, just linking small
  # probes against the prefix and running them over the freshly minted fixtures.
  full-gates:
    needs: [classify, full-build, full-aot]
    if: needs.classify.outputs.mode == 'full'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.classify.outputs.image }}
    env:
      ETVER: ${{ needs.classify.outputs.etver }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: full-prefix
      - uses: actions/download-artifact@v8
        with:
          name: full-fixtures
          path: fixtures-dryrun
      - name: Unpack the prefix
        run: |
          set -euo pipefail
          tar -xzf prefix.tar.gz
          [ -f out/lib/cmake/ExecuTorch/executorch-config.cmake ] \
            || { echo "::error::unpacked prefix is not an ET install"; exit 1; }
      - name: Live round-trip (fresh export -> run vs eager)
        # The verify half of the round-trip. consumer_smoke.py builds lstm_runner against the
        # prefix, runs the .pte, and compares to the golden at 1e-4 - the same runner, tolerance
        # and case source test_lstm_roundtrip.py uses. The fixtures here are FRESH from this
        # branch's AOT (see full-aot), not the published ones, so this catches AOT<->runtime
        # drift exactly as the pytest form did.
        run: |
          set -euo pipefail
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          pip install -r requirements/extras-build.txt
          FIXTURES_DIR="$PWD/fixtures-dryrun/lstm" ETNP_PREFIX="$PWD/out" \
            python extras/lstm/test/consumer_smoke.py
      - name: OpenVINO bundle dry-run (vendor + full smoke gate)
        # classify-gate.sh routes every OpenVINO change to `full`, so `full` has to actually
        # exercise OpenVINO - otherwise the routing buys nothing but "the flag still compiles".
        # This vendors the bundle and runs both smoke stages (resolve + blob import), which is
        # what catches a member-list regression such as a dropped libopenvino_ir_frontend.
        run: |
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          . ./scripts/lib/openvino.sh
          ./scripts/vendor-openvino.sh --out "$PWD/ovstage-dryrun"
          pip install -r requirements/openvino-runtime.txt
          bash test/openvino_smoke.sh "$PWD/ovstage-dryrun/$(ov_asset_stem linux-x86_64)"
      - name: OpenVINO end-to-end (fixture .pte through the runtime against the bundle)
        # The two checks above verify each half in isolation: the fixture is known to EXPORT, and
        # the bundle is known to import a synthetic blob. Neither loads a .pte through ExecuTorch,
        # so delegate registration and the Method init path were previously untested - the gap
        # that let a bundle missing libopenvino_ir_frontend reach a green gate. See issue #20.
        run: |
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          . ./scripts/lib/openvino.sh
          bash test/openvino_fixture_run.sh "$PWD/out" \
            "$PWD/ovstage-dryrun/$(ov_asset_stem linux-x86_64)" "$PWD/fixtures-dryrun/openvino"
      - name: XNNPACK workspace-size gate (behavioural probe)
        # The nm guard in build-runtime.sh proves the symbol exists; only this proves the value is
        # reachable through the published option and reflects a live arena.
        run: bash test/xnnpack_workspace_run.sh "$PWD/out" "$PWD/fixtures-dryrun/xnnpack"
