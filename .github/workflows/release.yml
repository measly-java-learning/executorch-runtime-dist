name: release
on:
  push:
    tags: ['v*-*']          # v<etver>-<pkgrev>, e.g. v1.3.1-1

permissions:
  contents: read

env:
  # Single source of truth for linux release platforms. manylinux bakes the architecture into the
  # container image name, so each entry carries its own container + runner. Adding a platform
  # (e.g. linux-aarch64) later is a one-line append here; no job-level YAML changes needed.
  PLATFORMS: >-
    [
        {"platform":"linux-x86_64","container":"quay.io/pypa/manylinux_2_28_x86_64","runs_on":"ubuntu-latest"},
        {"platform":"linux-aarch64","container":"quay.io/pypa/manylinux_2_28_aarch64","runs_on":"ubuntu-24.04-arm"}
    ]

jobs:
  setup:
    # env is not readable from strategy.matrix so build's matrix reads this job's output
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
        # `tee -a` used in place of `>>` to simplify debugging
      - id: platforms
        run: |
          {
            echo "platforms<<EOF"
            echo "$PLATFORMS"
            echo "EOF"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ${{ matrix.combo.runs_on }}
    container:
      image: ${{ matrix.combo.container }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        variant: [bare, logging, devtools]
        combo: ${{ fromJSON(needs.setup.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v7
      - name: Derive versions from tag
        id: ver
        run: ./scripts/derive-version.sh >> "$GITHUB_OUTPUT"
      - name: Checkout ExecuTorch source
        uses: ./.github/actions/checkout-executorch
        with:
          ref: ${{ steps.ver.outputs.ettag }}
      - name: Build runtime
        run: |
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          ./build-runtime.sh --variant "${{ matrix.variant }}" \
            --prefix "$PWD/out" --et-src "$PWD/et-src/executorch" \
            --et-tag "${{ steps.ver.outputs.ettag }}"
      - name: LSTM round-trip gate (export -> run vs eager)
        # Variant-identical kernel: gate on `logging` only (both platforms). The round-trip
        # recipe now lives in the composite action, shared with the extras-gate workflow.
        if: matrix.variant == 'logging'
        uses: ./.github/actions/lstm-roundtrip
        with:
          # workspace-relative (built at $PWD/out above); the action re-roots onto $PWD, the
          # real container workspace — the github.workspace expression is the host path here.
          prefix: out
      - name: Emit + package LSTM fixtures (arch-independent; x86_64 logging only)
        if: matrix.variant == 'logging' && matrix.combo.platform == 'linux-x86_64'
        run: |
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          # torch + executorch are already installed by the round-trip action above; the
          # built prefix is $PWD/out. Mint the fixtures from the SAME lstm_case source.
          python extras/lstm/aot/emit_fixtures.py "$PWD/fixtures"
          mkdir -p "$PWD/dist"
          ./scripts/package-fixtures.sh --dir "$PWD/fixtures" \
            --etver "${{ steps.ver.outputs.etver }}" --outdir "$PWD/dist"
          # OpenVINO fixture: same job, because torch + the pinned executorch package are already
          # installed here. Only the AOT-side OpenVINO deps are new. nncf is required even though
          # we never quantize (backends/openvino/__init__ imports OpenVINOQuantizer -> nncf).
          . ./scripts/lib/openvino.sh
          pip install "openvino==${OV_VERSION}" "nncf==3.1.0"
          python scripts/emit-openvino-fixtures.py "$PWD/ovfixtures"
          ./scripts/package-openvino-fixtures.sh --dir "$PWD/ovfixtures" \
            --etver "${{ steps.ver.outputs.etver }}" --outdir "$PWD/dist"
      - name: Package
        run: |
          ./scripts/package.sh --prefix "$PWD/out" --etver "${{ steps.ver.outputs.etver }}" \
            --variant "${{ matrix.variant }}" --platform "${{ matrix.combo.platform }}" \
            --package-tag "${GITHUB_REF_NAME}" --outdir "$PWD/dist"
      - name: Extras members + ETNPExtras relocatability gate
        # The last place the SHIPPED bytes are checked. Asserts phase 2 installed every extras
        # member and that ETNPExtras.cmake leaked no absolute build prefix — a leak breaks
        # find_package for every consumer, which is the same class of defect the recipe's sed
        # repairs exist to prevent. Runs before attestation, so a bad prefix cannot be published.
        # Linux-only for free: the Windows job is separate and ships no extras.
        run: PREFIX="$PWD/out" bash test/extras_members.sh
      - name: Relocatability + PIC gate
        # Producing position-independent static libs is this repo's whole purpose, so prove it on the
        # real built prefix before the artifact is attested. The script self-provisions inside
        # manylinux (pip-installs ninja, sources gcc-toolset-14) and links test/consumer as a SHARED
        # library — a .so link is what actually catches a PIC regression; an executable would not.
        run: bash test/relocatability.sh "$PWD/out"
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.variant }}-${{ matrix.combo.platform }}
          path: dist/*

  #
  # Windows amd64 support is implemented via `build-windows` below (MSVC, logging variant
  # only, GitHub-hosted windows-2022 runner, no container). It builds TWO platforms that differ
  # only in the C runtime — windows-x86_64 (/MD, for CPython extensions) and
  # windows-x86_64-static (/MT, for self-contained JNI DLLs) — because MSVC bakes the CRT into
  # every object and a consumer must link the flavor matching its own. NOTE: these platforms are
  # NOT in env.PLATFORMS; that list drives the linux container matrix only. macOS remains future
  # work and would follow this job's pattern, uploading via the same `dist-variant-platform`
  # naming and added to `pin`'s `needs`.

  build-windows:
    needs: setup
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        variant: [logging]
        # Two CRT flavors. MSVC bakes the CRT into every object, so a consumer must link the one
        # matching its own: /MD for CPython extensions, /MT for self-contained JNI DLLs.
        platform: [windows-x86_64, windows-x86_64-static]
    steps:
      - name: Configure Git for Windows checkout (long paths + symlinks)
        # Two Windows-specific git defaults break the recursive ExecuTorch checkout below:
        #  - longpaths: third-party/ao -> cutlass has CUDA example filenames past the 260-char
        #    MAX_PATH, so recursive checkout dies with "Filename too long". core.longpaths=true
        #    makes Git use the \\?\ extended-length prefix.
        #  - symlinks: Git-for-Windows defaults core.symlinks=false, so ET's symlinked paths would
        #    materialize as text stub files (containing the target path) and break the build.
        #    GitHub-hosted windows runners hold SeCreateSymbolicLinkPrivilege, so real symlinks work.
        # --system so both apply to every git subprocess the checkout action spawns for submodules.
        shell: pwsh
        run: |
          git config --system core.longpaths true
          git config --system core.symlinks true
      - uses: actions/checkout@v7
      - name: Derive versions from tag
        id: ver
        shell: bash
        run: ./scripts/derive-version.sh >> "$GITHUB_OUTPUT"
      - name: Checkout ExecuTorch source
        uses: ./.github/actions/checkout-executorch
        with:
          ref: ${{ steps.ver.outputs.ettag }}
      - name: Build runtime (MSVC)
        shell: pwsh
        run: |
          # build-runtime.ps1 resolves VS, sources the dev shell, and finds Git-Bash; the recipe
          # runs under it with args passed verbatim (same pattern as iree-runtime-dist).
          & ./build-runtime.ps1 ./build-runtime.sh --variant ${{ matrix.variant }} `
            --prefix "$PWD/out" --et-src "$PWD/et-src/executorch" `
            --et-tag ${{ steps.ver.outputs.ettag }} --platform ${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { throw "build failed (exit $LASTEXITCODE)" }
      - name: Package
        shell: bash
        run: |
          ./scripts/package.sh --prefix "$PWD/out" --etver "${{ steps.ver.outputs.etver }}" \
            --variant "${{ matrix.variant }}" --platform ${{ matrix.platform }} \
            --package-tag "${GITHUB_REF_NAME}" --outdir "$PWD/dist" \
            --toolchain "msvc-2022"
      - name: Relocatability smoke (MSVC link against the packaged tarball)
        # Gate the artifact before we attest/upload it: prove the tarball we are about to ship is
        # relocatable (no absolute build path in lib/cmake) and links under MSVC from a moved prefix
        # via test/consumer's find_package(executorch) probe. Runs on the packaged .tar.gz — the exact
        # bytes consumers get — so it also catches packaging faults (e.g. lib/cmake not staged).
        shell: pwsh
        run: |
          # Same VS-activation -> Git-Bash handoff as the build step, via build-runtime.ps1
          # (-Command mode runs the inline bash under the dev shell).
          & ./build-runtime.ps1 -Command 'set -euo pipefail; t="$(ls dist/*-${{ matrix.platform }}.tar.gz | head -n1)"; ./test/relocatability-windows.sh "$t" ${{ matrix.platform }}'
          if ($LASTEXITCODE -ne 0) { throw "relocatability smoke failed (exit $LASTEXITCODE)" }
      - name: CRT consistency scan
        # Proves every installed static lib positively carries the CRT this platform promises.
        # Catches a dependency that hardcodes its own CRT, which the consumer-link gate above would
        # miss if the offending lib is not on the probe's link line.
        shell: pwsh
        run: |
          # Same VS-activation -> Git-Bash handoff as the build step, via build-runtime.ps1
          # (-Command mode runs the inline bash under the dev shell).
          & ./build-runtime.ps1 -Command 'set -euo pipefail; . scripts/lib/configure-base.sh; crt="$(crt_for_platform ${{ matrix.platform }})"; ./scripts/check-windows-crt.sh "$PWD/out" "$crt"'
          if ($LASTEXITCODE -ne 0) { throw "CRT consistency scan failed (exit $LASTEXITCODE)" }
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.variant }}-${{ matrix.platform }}
          path: dist/*

  # The OpenVINO CPU runtime, vendored from the Apache-2.0 PyPI wheel into a flat, $ORIGIN-resolving
  # bundle (contract C10). Linux x86_64 only and INDEPENDENT of the {variant} x {platform} matrix:
  # the bundle contains no ExecuTorch code, is identical for all three variants, and is versioned by
  # OpenVINO version rather than ET version. Runs in manylinux for the same glibc floor as the
  # runtime tarballs.
  openvino:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Vendor the OpenVINO runtime bundle
        run: |
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          ./scripts/vendor-openvino.sh --out "$PWD/ovstage"
      - name: Runtime smoke gate (resolve + enumerate CPU + import a compiled blob)
        # Proves the flat bundle self-resolves AND can actually deserialize a model, before it is
        # attested. The blob-import stage is not optional: a bundle missing libopenvino_ir_frontend
        # enumerates CPU cleanly and then fails every delegated .pte at load. Minting the blob needs
        # only the openvino PYTHON package (no torch), pinned to the same version we vendor.
        run: |
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          . ./scripts/lib/openvino.sh
          pip install "openvino==${OV_VERSION}"
          bash test/openvino_smoke.sh "$PWD/ovstage/$(ov_asset_stem linux-x86_64)"
      - name: Package
        run: |
          . ./scripts/lib/openvino.sh
          mkdir -p "$PWD/dist"
          stem="$(ov_asset_stem linux-x86_64)"
          tar -C "$PWD/ovstage" -czf "$PWD/dist/$(ov_tarball_name linux-x86_64)" "$stem"
          ( cd "$PWD/dist" && sha256sum "$(ov_tarball_name linux-x86_64)" > "$(ov_sha_name linux-x86_64)" )
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: dist-openvino
          path: dist/*

  pin:
    needs: [build, build-windows, openvino]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate EtRuntimePin.cmake
        run: |
          eval "$(./scripts/derive-version.sh)"
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          args=(--version "$pkgver" --etver "$etver" --base-url "$base")
          # C10: fold in the OpenVINO bundle. Reading the sha from the sibling .sha256 keeps
          # gen-pin.sh's contract (it never hashes files itself).
          #
          # REQUIRED, not best-effort: this job hard-`needs: openvino`, so a missing sidecar means
          # artifact-name drift or a partial download — not "no OpenVINO this release". Skipping
          # silently would still publish openvino-runtime-*.tar.gz (release globs dist/*) while
          # emitting a pin with no ET_RUNTIME_OPENVINO_* vars, breaking every consumer with no CI
          # signal at all. Fail here instead; gen-pin.sh additionally validates the sha is 64 hex.
          . ./scripts/lib/openvino.sh
          ovsha_file="dist/$(ov_sha_name linux-x86_64)"
          [ -f "$ovsha_file" ] || {
            echo "::error::expected $ovsha_file from the openvino job; refusing to publish a release whose pin omits OpenVINO"
            exit 1; }
          args+=(--openvino-sha "$(cut -d' ' -f1 "$ovsha_file")")
          while IFS=$'\t' read -r variant platform sha; do
            args+=(--row "$variant" "$platform" "$sha")
          done < <(./scripts/discover-pin-rows.sh --dir dist --etver "$etver")
          ./scripts/gen-pin.sh "${args[@]}" > dist/EtRuntimePin.cmake
          {
            echo '```cmake'
            cat dist/EtRuntimePin.cmake
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: pin
          path: dist/EtRuntimePin.cmake

  release:
    needs: pin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create/Update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "ExecuTorch runtime ${GITHUB_REF_NAME} (torch 2.12.0+cpu). Per-artifact toolchain in each BUILDINFO." \
          || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
